<div id="settings-page">
	
	<div class="row">
		<div class="col">
			
		
			<form class="form-horizontal" name="settings">
				<h3>Settings</h3>
				<table class="table">
					<tr>
						<td><label for="email">Email:</label></td>
						<td><input type="email" id="email" name="email" size="25" disabled></td>
					</tr>
				</table>
			</form>
			
			<!--<hr/>-->
			
			<form class="form-horizontal" name="frm-change-pass">
				<br/>
				<table class="table">
					<tr>
						<td colspan="2"><h6><strong>Change Password</strong></h6></td>
					</tr>
					<tr>
						<td><label for="newPass">New Password:</label></td>
					</tr>
					<tr>
						<td><input type="text" id="newPass" name="newPass"></td>
						<td><a id="btn-change-pass" class="btn settings-btn">CHANGE</a></td>
					</tr>
					<tr>
						<td id="change-pass-result"></td>
					</tr>
				</table>
			</form>
		</div>
	</div>
		
		
	<div class="row">
		<div class="col">
			<a href="#" class="btn settings-btn w-100" id="btn_logout_app">LOG OUT</a>
		</div>
	</div>
</div>
